# Cargo configuration for Android cross-compilation
# Note: NDK r29 only supports ARM64 and x86_64 (ARMv7 was removed)

[target.aarch64-linux-android]
ar = "/Users/vijaysingh/Library/Android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
linker = "/Users/vijaysingh/Library/Android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/aarch64-linux-android34-clang"

[target.x86_64-linux-android]
ar = "/Users/vijaysingh/Library/Android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/llvm-ar"
linker = "/Users/vijaysingh/Library/Android/sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/darwin-x86_64/bin/x86_64-linux-android34-clang"

[env]
