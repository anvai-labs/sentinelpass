[package]
name = "sentinelpass-mobile-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Mobile FFI/JNI bridge for SentinelPass core library"
keywords.workspace = true
categories.workspace = true

[lib]
# rlib: required so integration tests (tests/) and the workspace can link
# the bridge; cdylib: Android .so; staticlib: iOS .a.
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
jni = ["dep:jni"]
ios = []

[dependencies]
sentinelpass-core = { path = "../sentinelpass-core" }

# Serialization (JNI wire DTOs)
serde = { workspace = true }
serde_json = { workspace = true }

# Hex encoding for slot challenges/signatures (WBS-812/821)
hex = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Secret hygiene (WBS-804: biometric key buffers zeroize on drop)
zeroize = { workspace = true }

# JNI (Android)
jni = { version = "0.21", optional = true }

# Logging
tracing = { workspace = true }

# Time
chrono = { workspace = true }

[dev-dependencies]
# Slot-test fake platform: deterministic "signatures" (WBS-812/821)
hmac = { workspace = true }
sha2 = { workspace = true }

[build-dependencies]
cbindgen = "0.26"
