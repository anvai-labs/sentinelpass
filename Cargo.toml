[workspace]
members = [
    "sentinelpass-protocol",
    "sentinelpass-core",
    "sentinelpass-cli",
    "sentinelpass-daemon",
    "sentinelpass-host",
    "sentinelpass-ui",
    "sentinelpass-relay",
    "sentinelpass-mobile-bridge",
]
exclude = ["vendor/wayland-scanner"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["VJ Singh <vijay@anvaiops.com>"]
license = "Apache-2.0"
repository = "https://github.com/anvai-labs/sentinelpass"
homepage = "https://github.com/anvai-labs/sentinelpass"
description = "A secure, local-first password manager with browser autofill"
keywords = ["password", "security", "vault", "autofill"]
categories = ["command-line-utilities", "authentication"]

[workspace.dependencies]
# Cryptography
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1.7", features = ["zeroize_derive", "serde"] }
subtle = "2.5"
hex = "0.4"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# UUID
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cross-platform directories
dirs = "5.0"

# Binary serialization
bincode = "1.3"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Password prompting
rpassword = "7.3"
dialoguer = "0.11"

# Home directory
home = "0.5"

# Testing
proptest = "1.4"
tempfile = "3.10"

# SSH keys
ssh-key = { version = "0.6", features = ["crypto", "encryption"] }
rsa = "0.9"
ed25519-dalek = "2.0"
p256 = "0.13"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hkdf = "0.12"
data-encoding = "2.6"
base64 = "0.22"

# HTTP / Sync
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
url = "2.5"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
toml_dep = { package = "toml", version = "0.8" }

# System
hostname = "0.4"

[patch.crates-io]
# Released 0.31.10 plus upstream's dependency-only security fix. Remove this
# vendor after wayland-scanner publishes quick-xml 0.41 support.
wayland-scanner = { path = "vendor/wayland-scanner" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Mobile bridge build-only (not in workspace dependencies to avoid optional issues)
# These are added directly to sentinelpass-mobile-bridge/Cargo.toml
