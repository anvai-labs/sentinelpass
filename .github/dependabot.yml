version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /browser-extension/chrome
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /browser-extension/e2e
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
