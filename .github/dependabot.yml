version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Ground rules (CLAUDE.md/AGENTS.md): integration happens on develop;
    # promotion to main is the single-commit release train.
    target-branch: develop
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # hmac 0.13 requires the digest-0.11 trait stack (sha2 0.11); the crypto
    # stack here is digest-0.10-based. Revisit when sha2 0.11 lands.
    # hkdf 0.13 sits on hmac 0.13 internally — bumping it alone duals the MAC
    # crate. Migrate hkdf+hmac+sha2 together, golden-vector-verified.
    # windows 0.62 duals the binding stack while the Tauri ecosystem
    # (tauri/tao/wry/webview2-com) pins 0.61 — take it when they unify.
    ignore:
      - dependency-name: hmac
        versions: [">=0.13"]
      - dependency-name: hkdf
        versions: [">=0.13"]
      - dependency-name: windows
        versions: [">=0.62"]
    # rusqlite 0.31+ spans ten breaking minors from our 0.30 base (including a
    # multi-year bundled-SQLite jump) AND would invalidate the fault-injection
    # behavior invariant (authorizer fires only at PREPARE — see the header of
    # database/fault_injection.rs). Upgrade via a dedicated reviewed slice
    # exercising the migration ladder and the v6/v7/v8 restore fixtures.
      - dependency-name: rusqlite
        versions: [">=0.31"]
    # jni 0.22 changes the JNIEnv/JString APIs the mobile bridge pins
    # (Android/iOS CI legs fail to build) — migrate via a dedicated
    # mobile-bridge slice with the JNI contract tests.
      - dependency-name: jni
        versions: [">=0.22"]
    # rand 0.9 reorganizes the RngCore/trait stack (fill_bytes bounds fail
    # workspace-wide, incl. anvai crypto + 0.14.0 service credentials).
    # Worth a real migration slice someday; not a dependabot bump.
      - dependency-name: rand
        versions: [">=0.9"]
    # sha1 0.11 sits on the pre-release digest-0.11 trait stack and would
    # dual sha2/hmac (same class as the hmac 0.13 rule above).
      - dependency-name: sha1
        versions: [">=0.11"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /browser-extension/chrome
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /browser-extension/e2e
    schedule:
      interval: weekly
    target-branch: develop
    groups:
      npm-dev:
        dependency-type: development
