version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    # hmac 0.13 requires the digest-0.11 trait stack (sha2 0.11); the crypto
    # stack here is digest-0.10-based. Revisit when sha2 0.11 lands.
    # hkdf 0.13 sits on hmac 0.13 internally — bumping it alone duals the MAC
    # crate. Migrate hkdf+hmac+sha2 together, golden-vector-verified.
    # windows 0.62 duals the binding stack while the Tauri ecosystem
    # (tauri/tao/wry/webview2-com) pins 0.61 — take it when they unify.
    ignore:
      - dependency-name: hmac
        versions: [">=0.13"]
      - dependency-name: hkdf
        versions: [">=0.13"]
      - dependency-name: windows
        versions: [">=0.62"]
    # rusqlite 0.31+ spans ten breaking minors from our 0.30 base (including a
    # multi-year bundled-SQLite jump) AND would invalidate the fault-injection
    # behavior invariant (authorizer fires only at PREPARE — see the header of
    # database/fault_injection.rs). Upgrade via a dedicated reviewed slice
    # exercising the migration ladder and the v6/v7/v8 restore fixtures.
      - dependency-name: rusqlite
        versions: [">=0.31"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
    # vitest 5 requires Node >= 22.12 while both CI jobs that run it
    # (rust.yml web_tdd via setup-rust-env, extension-e2e) pin Node 20 —
    # vitest 5 has no startup guard, so an unsupported-Node run would not
    # fail loudly. Bump together with a coordinated CI Node 22+ change.
    ignore:
      - dependency-name: vitest
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]

  - package-ecosystem: npm
    directory: /browser-extension/chrome
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /browser-extension/e2e
    schedule:
      interval: weekly
    groups:
      npm-dev:
        dependency-type: development
