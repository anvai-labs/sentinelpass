name: Extension Browser E2E

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "browser-extension/chrome/**"
      - "browser-extension/e2e/**"
      - "sentinelpass-daemon/**"
      - "sentinelpass-host/**"
      - "sentinelpass-cli/**"
      - "sentinelpass-core/src/daemon/**"
      - ".github/workflows/extension-e2e.yml"

jobs:
  browser-e2e:
    name: Run Browser Integration Tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            browser-extension/e2e/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install root web dependencies
        run: npm ci

      - name: Type-check web sources
        run: npm run web:typecheck

      - name: Build extension/UI JS artifacts
        run: npm run web:build

      - name: Run TypeScript unit tests with coverage
        run: npm run test:ts

      - name: Install test dependencies
        working-directory: browser-extension/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: browser-extension/e2e
        run: npx playwright install chromium

      - name: Install xvfb (X Virtual Framebuffer)
        run: sudo apt-get update && sudo apt-get install -y xvfb libssl-dev

      - name: Build daemon, host, and CLI (real-backend E2E)
        run: cargo build --locked -p sentinelpass-daemon -p sentinelpass-host -p sentinelpass-cli

      - name: Run extension browser e2e tests (daemon + native host + browser)
        working-directory: browser-extension/e2e
        run: xvfb-run --auto-servernum npm run test:e2e
