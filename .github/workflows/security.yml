name: Security CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust_audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c # cargo-audit
      - name: Run cargo audit
        # Temporary exception: RUSTSEC-2023-0071 is transitive via rsa/ssh-key with no patched release yet.
        run: cargo audit --ignore RUSTSEC-2023-0071

  npm_audit_root:
    name: npm Audit (Root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Run npm audit (high+)
        # registry.npmjs.org audit endpoint 503s intermittently (seen 3x in
        # one day); retry before concluding there is a real finding
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then exit 0; fi
            echo "::warning::npm audit attempt ${attempt} failed (registry flake?) - retrying in 60s"
            sleep 60
          done
          exit 1

  npm_audit_e2e:
    name: npm Audit (Extension E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-extension/e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: browser-extension/e2e
        run: npm ci
      - name: Run npm audit (high+)
        working-directory: browser-extension/e2e
        # same registry-flake retry as the root audit job
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then exit 0; fi
            echo "::warning::npm audit attempt ${attempt} failed (registry flake?) - retrying in 60s"
            sleep 60
          done
          exit 1

  trivy:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run Trivy scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
