name: Release CI

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Determine if this is a release or preflight run
  setup:
    name: Release Setup
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Check if release
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        name: Determine version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{print $2;exit}' Cargo.toml)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Package and smoke test across platforms
  # Downloads artifacts from rust.yml if available, otherwise builds fresh
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            shell: bash
          - os: macos-latest
            platform: macos
            shell: bash
          - os: windows-latest
            platform: windows
            shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: release-${{ matrix.platform }}

      # Try to download cached build artifacts from rust.yml
      - name: Download cached Rust artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: rust-build-${{ matrix.platform }}
          path: target/release

      # Download web artifacts if available
      - name: Download cached web artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: web-artifacts-${{ matrix.platform }}
          path: .

      # If artifacts weren't available, build fresh
      - name: Build release binaries (if not cached)
        shell: bash
        run: |
          if [ ! -f "target/release/sentinelpass${{ runner.os == 'Windows' && '.exe' || '' }}" ]; then
            cargo build --release --bin sentinelpass --bin sentinelpass-daemon --bin sentinelpass-host --bin sentinelpass-ui
          else
            echo "Using cached build artifacts"
          fi

      - name: Inject release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ needs.setup.outputs.is-release }}" == "true" ]; then
            sed -i.bak "/\[workspace\.package\]/,/^\[/{s/^version = \".*\"/version = \"${VERSION}\"/;}" Cargo.toml && rm -f Cargo.toml.bak
            cargo update --workspace
            # Also inject version into tauri.conf.json so DMG/MSI filenames match
            TAURI_CONF="sentinelpass-ui/tauri.conf.json"
            if [ -f "$TAURI_CONF" ]; then
              sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" "$TAURI_CONF" && rm -f "${TAURI_CONF}.bak"
            fi
          fi

      - name: Package archives (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          portable_name="sentinelpass-${VERSION}-${{ matrix.platform }}.tar.gz"
          installer_name="sentinelpass-installer-${VERSION}-${{ matrix.platform }}.tar.gz"

          mkdir -p dist/portable/root
          cp target/release/sentinelpass dist/portable/root/
          cp target/release/sentinelpass-daemon dist/portable/root/
          cp target/release/sentinelpass-host dist/portable/root/
          cp target/release/sentinelpass-ui dist/portable/root/
          cp README.md LICENSE dist/portable/root/
          tar -czf "dist/${portable_name}" -C dist/portable/root .

          mkdir -p dist/installer/root/target/release
          cp target/release/sentinelpass dist/installer/root/target/release/
          cp target/release/sentinelpass-daemon dist/installer/root/target/release/
          cp target/release/sentinelpass-host dist/installer/root/target/release/
          cp target/release/sentinelpass-ui dist/installer/root/target/release/
          cp install.sh install-user.sh install-user.command README.md LICENSE dist/installer/root/
          cp -R installation dist/installer/root/
          mkdir -p dist/installer/root/browser-extension
          cp -R browser-extension/chrome dist/installer/root/browser-extension/
          if [ -d browser-extension/firefox ]; then
            cp -R browser-extension/firefox dist/installer/root/browser-extension/
          fi
          tar -czf "dist/${installer_name}" -C dist/installer/root .

      - name: Package archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $portableName = "sentinelpass-${VERSION}-${{ matrix.platform }}.zip"
          $installerName = "sentinelpass-installer-${VERSION}-${{ matrix.platform }}.zip"

          New-Item -ItemType Directory -Force -Path dist/portable/root | Out-Null
          Copy-Item target/release/sentinelpass.exe dist/portable/root/
          Copy-Item target/release/sentinelpass-daemon.exe dist/portable/root/
          Copy-Item target/release/sentinelpass-host.exe dist/portable/root/
          Copy-Item target/release/sentinelpass-ui.exe dist/portable/root/
          Copy-Item README.md dist/portable/root/
          Copy-Item LICENSE dist/portable/root/
          Compress-Archive -Path dist/portable/root/* -DestinationPath "dist/$portableName" -Force

          New-Item -ItemType Directory -Force -Path dist/installer/root/target/release | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installer/root/installation | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installer/root/browser-extension | Out-Null

          Copy-Item target/release/sentinelpass.exe dist/installer/root/target/release/
          Copy-Item target/release/sentinelpass-daemon.exe dist/installer/root/target/release/
          Copy-Item target/release/sentinelpass-host.exe dist/installer/root/target/release/
          Copy-Item target/release/sentinelpass-ui.exe dist/installer/root/target/release/

          Copy-Item install.ps1 dist/installer/root/
          Copy-Item install-user.cmd dist/installer/root/
          Copy-Item register-chrome.ps1 dist/installer/root/
          Copy-Item register-firefox.ps1 dist/installer/root/
          Copy-Item update-extension-id.ps1 dist/installer/root/

          Copy-Item installation/install.ps1 dist/installer/root/installation/
          Copy-Item installation/com.passwordmanager.host.json dist/installer/root/installation/

          Copy-Item -Recurse browser-extension/chrome dist/installer/root/browser-extension/
          if (Test-Path browser-extension/firefox) {
            Copy-Item -Recurse browser-extension/firefox dist/installer/root/browser-extension/
          }
          Copy-Item README.md dist/installer/root/
          Copy-Item LICENSE dist/installer/root/
          Compress-Archive -Path dist/installer/root/* -DestinationPath "dist/$installerName" -Force

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  # Bundle smoke tests
  bundle-smoke:
    name: Bundle Smoke Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform }}
          path: dist

      - name: Verify portable archive exists
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            ls -la dist/sentinelpass-*.zip
          else
            ls -la dist/sentinelpass-*.tar.gz
          fi

      - name: Verify installer archive exists
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            ls -la dist/sentinelpass-installer-*.zip
          else
            ls -la dist/sentinelpass-installer-*.tar.gz
          fi

  # Native installer smoke tests (only for real releases)
  native-installer-smoke:
    name: Native Installer Smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: package
    if: needs.setup.outputs.is-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@v7

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: packages-${{ matrix.platform }}
          path: dist

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: installer-${{ matrix.platform }}
          web-build: true

      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Tauri bundles
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          cd sentinelpass-ui
          cargo tauri build --verbose

      - name: List bundle outputs
        shell: bash
        run: |
          echo "Tauri bundle outputs:"
          for dir in sentinelpass-ui/target/release/bundle target/release/bundle; do
            if [ -d "$dir" ]; then
              echo "Found bundles in $dir:"
              find "$dir" -type f -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.app' | head -20
            fi
          done

      - name: Upload Tauri bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-bundles-${{ matrix.platform }}
          path: |
            sentinelpass-ui/target/release/bundle/deb/*.deb
            sentinelpass-ui/target/release/bundle/appimage/*.AppImage
            sentinelpass-ui/target/release/bundle/dmg/*.dmg
            sentinelpass-ui/target/release/bundle/macos/*.app
            sentinelpass-ui/target/release/bundle/msi/*.msi
            sentinelpass-ui/target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7

  # Create GitHub release and upload assets
  # Crates.io publish for the reusable protocol contract crate: sandhi's
  # sandhi-store pins sentinelpass-protocol, so an unpublished protocol crate
  # breaks a DIFFERENT repository's release. Review-hardened:
  # - runs only on real v* TAG pushes (a branch named v* must not reach the
  #   registry via workflow_dispatch);
  # - the gate checks the MANIFEST version at the tag, not the tag name — this
  #   repo's history has 13 of 17 tags where the two disagreed, and the tag
  #   name is exactly what an earlier draft wrongly trusted (re-review
  #   finding 1); a mismatch fails the job loudly instead of publishing a
  #   wrong version irreversibly;
  # - the publish step requires the gate to SUCCEED (not merely be skipped):
  #   a network-broken gate must not be followed by a publish attempt.
  # A yanked version still answers 200, so a yank is permanent — standard
  # crates.io semantics, noted rather than worked around.
  crates-publish:
    name: Publish sentinelpass-protocol to crates.io
    needs: setup
    if: >-
      ${{ needs.setup.outputs.is-release == 'true' &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag/manifest agreement and crates.io presence
        id: gate
        env:
          TAG_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{print $2;exit}' Cargo.toml)
          if [ "$TAG_VERSION" != "$manifest_version" ]; then
            echo "::error::tag is v${TAG_VERSION} but the workspace manifest says ${manifest_version} — bump the manifest inside the release commit (this repo's history: 13 of 17 tags were out of sync)"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "sentinelpass-release" \
            "https://crates.io/api/v1/crates/sentinelpass-protocol/${manifest_version}" || echo 000)
          if [ "$status" = "200" ]; then
            echo "sentinelpass-protocol ${manifest_version} already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "not yet published — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io returned ${status} — refusing to publish on an unclear answer"
            exit 1
          fi
      - name: Publish sentinelpass-protocol
        if: ${{ success() && steps.gate.outputs.skip == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p sentinelpass-protocol --locked

  # Create GitHub release and upload assets
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [setup, bundle-smoke, native-installer-smoke]
    if: needs.setup.outputs.is-release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Download Tauri bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: tauri-bundles-*
          path: tauri-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f -exec sha256sum {} + > sha256sums.txt
          cat sha256sums.txt

      - name: Copy Tauri bundles to release assets
        shell: bash
        run: |
          VERSION="${{ needs.setup.outputs.version }}"

          # Function to find and copy bundles from potential locations
          find_and_copy_bundles() {
            local pattern="$1"
            local dest_name="$2"

            # Check tauri-assets directory
            if [ -d "tauri-assets" ]; then
              find tauri-assets -name "$pattern" -type f -print0 | xargs -0 -I {} cp {} "release-assets/$dest_name" 2>/dev/null && return 0
            fi

            # Check if tauri-assets has subdirectories
            if [ -d "tauri-assets/bundle" ]; then
              find tauri-assets/bundle -name "$pattern" -type f -print0 | xargs -0 -I {} cp {} "release-assets/$dest_name" 2>/dev/null && return 0
            fi

            # Check tauri-assets/deb, tauri-assets/appimage, etc.
            for dir in deb appimage dmg app msi nsis update; do
              if [ -d "tauri-assets/$dir" ]; then
                find "tauri-assets/$dir" -name "$pattern" -type f -print0 | xargs -0 -I {} cp {} "release-assets/" 2>/dev/null
              fi
            done

            return 0
          }

          echo "Searching for Tauri bundles..."

          # Copy macOS DMG
          find_and_copy_bundles "*.dmg" ""
          # Try to rename to expected filename
          if ls release-assets/*.dmg 1> /dev/null 2>&1; then
            FIRST_DMG=$(ls release-assets/*.dmg | head -1)
            if [ ! -f "release-assets/sentinelpass-${VERSION}-macos.dmg" ]; then
              cp "$FIRST_DMG" "release-assets/sentinelpass-${VERSION}-macos.dmg"
            fi
          fi

          # Copy Windows MSI
          find_and_copy_bundles "*.msi" ""
          # Try to rename to expected filename
          if ls release-assets/*.msi 1> /dev/null 2>&1; then
            FIRST_MSI=$(ls release-assets/*.msi | head -1)
            if [ ! -f "release-assets/sentinelpass-${VERSION}-windows.msi" ]; then
              cp "$FIRST_MSI" "release-assets/sentinelpass-${VERSION}-windows.msi"
            fi
          fi

          # Also copy other bundle types
          find_and_copy_bundles "*.deb" ""
          find_and_copy_bundles "*.AppImage" ""
          find_and_copy_bundles "*.app" ""
          find_and_copy_bundles "*.exe" ""

          echo "Tauri bundles copied:"
          ls -la release-assets/ | grep -E '\.(dmg|msi|deb|AppImage|exe)$' || echo "No bundle files found"

      - name: Regenerate SHA256 checksums with Tauri bundles
        shell: bash
        run: |
          cd release-assets
          find . -type f -exec sha256sum {} + > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION}

          ## Installation

          ### macOS DMG (Recommended)
          \`\`\`bash
          # Download DMG installer
          curl -LO https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-${VERSION}-macos.dmg
          # Open DMG and drag to Applications
          open sentinelpass-${VERSION}-macos.dmg
          \`\`\`

          ### Windows MSI (Recommended)
          \`\`\`powershell
          # Download MSI installer
          Invoke-WebRequest -Uri https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-${VERSION}-windows.msi -OutFile installer.msi
          # Run installer
          msiexec /i installer.msi
          \`\`\`

          ### Linux (Tarball)
          \`\`\`bash
          # Download tarball installer
          wget https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-installer-${VERSION}-linux.tar.gz
          tar -xzf sentinelpass-installer-${VERSION}-linux.tar.gz
          cd installer-root
          ./install.sh
          \`\`\`

          ### macOS (Homebrew)
          \`\`\`bash
          brew tap anvai-labs/tap https://github.com/anvai-labs/homebrew-tap
          brew install anvai-labs/tap/sentinelpass
          \`\`\`

          ### Ubuntu/Debian (.deb, Tauri desktop app)
          \`\`\`bash
          wget https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass_${VERSION}_amd64.deb
          sudo apt install ./sentinelpass_${VERSION}_amd64.deb
          \`\`\`

          ## Browser Extensions

          ### Chrome
          Download [sentinelpass-chrome-${VERSION}.zip](https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-chrome-${VERSION}.zip), unzip, and load as unpacked extension.

          ### Firefox
          Download [sentinelpass-firefox-${VERSION}.zip](https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-firefox-${VERSION}.zip) and install temporarily.

          ## Verify Download

          \`\`\`bash
          sha256sum -c sha256sums.txt
          \`\`\`"
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          cd release-assets
          gh release upload "v${VERSION}" --clobber $(find . -type f)

  homebrew:
    name: Bump Homebrew formula
    runs-on: ubuntu-latest
    needs: [setup, release]
    if: needs.setup.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Bump formula in anvai-labs/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "TAP_TOKEN secret not set — skipping Homebrew formula bump."
            echo "Configure a fine-grained PAT with Contents:write on anvai-labs/homebrew-tap to enable."
            exit 0
          fi
          bash scripts/bump-homebrew-formula.sh "$VERSION"
