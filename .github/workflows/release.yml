name: Release CI

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      # docs-only PRs skip release packaging (this workflow has no path
      # filter by design for releases; PRs are preflight)
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Determine if this is a release or preflight run
  setup:
    name: Release Setup
    runs-on: ubuntu-24.04
    outputs:
      is-release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: check
        name: Check if release
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        name: Determine version
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{print $2;exit}' Cargo.toml)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # Package and smoke test across platforms
  # Downloads artifacts from rust.yml if available, otherwise builds fresh
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            shell: bash
          - os: macos-latest
            platform: macos
            shell: bash
          - os: windows-latest
            platform: windows
            shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: release-${{ matrix.platform }}

      # Try to download cached build artifacts from rust.yml
      - name: Download cached Rust artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: rust-build-${{ matrix.platform }}
          path: target/release

      # Download web artifacts if available
      - name: Download cached web artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: web-artifacts-${{ matrix.platform }}
          path: .

      # If artifacts weren't available, build fresh.
      #
      # WBS-908 (SBOM): release binaries are built with `cargo auditable`
      # so every shipped binary EMBEDS its exact dependency list (versions
      # + checksums) in a compressed blob. Chosen over generating a
      # standalone SBOM file (syft/CycloneDX/SPDX) because the embedded
      # form travels with the artifact — anyone can verify what shipped
      # with `cargo audit bin ./sentinelpass` offline, it cannot drift
      # from the binary the way a sidecar file can, and it feeds
      # vulnerability matching without extra infrastructure. See
      # docs/OSS_RELEASE_CHECKLIST.md ("Supply chain / SBOM").
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked
      - name: Build release binaries (if not cached)
        shell: bash
        run: |
          if [ ! -f "target/release/sentinelpass${{ runner.os == 'Windows' && '.exe' || '' }}" ]; then
            cargo auditable build --release --bin sentinelpass --bin sentinelpass-daemon --bin sentinelpass-host --bin sentinelpass-ui
          else
            echo "Using cached build artifacts"
          fi

      # WBS-908 smoke gate (Linux): prove the embedded SBOM is really
      # present by auditing the built binary from its own embedded
      # dependency data. Fails the release if `cargo auditable` data is
      # missing or a dependency in the binary matches a known advisory.
      - name: Install cargo-audit (SBOM verification)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c # cargo-audit
      - name: Verify embedded SBOM (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo audit bin target/release/sentinelpass
          cargo audit bin target/release/sentinelpass-daemon

      - name: Inject release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.setup.outputs.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ needs.setup.outputs.is-release }}" == "true" ]; then
            sed -i.bak "/\[workspace\.package\]/,/^\[/{s/^version = \".*\"/version = \"${VERSION}\"/;}" Cargo.toml && rm -f Cargo.toml.bak
            cargo update --workspace
            # Also inject version into tauri.conf.json so DMG/MSI filenames match
            TAURI_CONF="sentinelpass-ui/tauri.conf.json"
            if [ -f "$TAURI_CONF" ]; then
              sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" "$TAURI_CONF" && rm -f "${TAURI_CONF}.bak"
            fi
          fi

      - name: Package archives (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          portable_name="sentinelpass-${VERSION}-${{ matrix.platform }}.tar.gz"
          installer_name="sentinelpass-installer-${VERSION}-${{ matrix.platform }}.tar.gz"

          mkdir -p dist/portable/root
          cp target/release/sentinelpass dist/portable/root/
          cp target/release/sentinelpass-daemon dist/portable/root/
          cp target/release/sentinelpass-host dist/portable/root/
          cp target/release/sentinelpass-ui dist/portable/root/
          cp README.md LICENSE dist/portable/root/
          tar -czf "dist/${portable_name}" -C dist/portable/root .

          mkdir -p dist/installer/root/target/release
          cp target/release/sentinelpass dist/installer/root/target/release/
          cp target/release/sentinelpass-daemon dist/installer/root/target/release/
          cp target/release/sentinelpass-host dist/installer/root/target/release/
          cp target/release/sentinelpass-ui dist/installer/root/target/release/
          cp install.sh install-user.sh install-user.command README.md LICENSE dist/installer/root/
          cp -R installation dist/installer/root/
          mkdir -p dist/installer/root/browser-extension
          cp -R browser-extension/chrome dist/installer/root/browser-extension/
          if [ -d browser-extension/firefox ]; then
            cp -R browser-extension/firefox dist/installer/root/browser-extension/
          fi
          tar -czf "dist/${installer_name}" -C dist/installer/root .

      - name: Package archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $portableName = "sentinelpass-${VERSION}-${{ matrix.platform }}.zip"
          $installerName = "sentinelpass-installer-${VERSION}-${{ matrix.platform }}.zip"

          New-Item -ItemType Directory -Force -Path dist/portable/root | Out-Null
          Copy-Item target/release/sentinelpass.exe dist/portable/root/
          Copy-Item target/release/sentinelpass-daemon.exe dist/portable/root/
          Copy-Item target/release/sentinelpass-host.exe dist/portable/root/
          Copy-Item target/release/sentinelpass-ui.exe dist/portable/root/
          Copy-Item README.md dist/portable/root/
          Copy-Item LICENSE dist/portable/root/
          Compress-Archive -Path dist/portable/root/* -DestinationPath "dist/$portableName" -Force

          New-Item -ItemType Directory -Force -Path dist/installer/root/target/release | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installer/root/installation | Out-Null
          New-Item -ItemType Directory -Force -Path dist/installer/root/browser-extension | Out-Null

          Copy-Item target/release/sentinelpass.exe dist/installer/root/target/release/
          Copy-Item target/release/sentinelpass-daemon.exe dist/installer/root/target/release/
          Copy-Item target/release/sentinelpass-host.exe dist/installer/root/target/release/
          Copy-Item target/release/sentinelpass-ui.exe dist/installer/root/target/release/

          Copy-Item install.ps1 dist/installer/root/
          Copy-Item install-user.cmd dist/installer/root/
          Copy-Item register-chrome.ps1 dist/installer/root/
          Copy-Item register-firefox.ps1 dist/installer/root/
          Copy-Item update-extension-id.ps1 dist/installer/root/

          Copy-Item installation/install.ps1 dist/installer/root/installation/
          Copy-Item installation/com.passwordmanager.host.json dist/installer/root/installation/

          Copy-Item -Recurse browser-extension/chrome dist/installer/root/browser-extension/
          if (Test-Path browser-extension/firefox) {
            Copy-Item -Recurse browser-extension/firefox dist/installer/root/browser-extension/
          }
          Copy-Item README.md dist/installer/root/
          Copy-Item LICENSE dist/installer/root/
          Compress-Archive -Path dist/installer/root/* -DestinationPath "dist/$installerName" -Force

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packages-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 7

  # Bundle smoke tests
  bundle-smoke:
    name: Bundle Smoke Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages-${{ matrix.platform }}
          path: dist

      - name: Verify portable archive exists
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            ls -la dist/sentinelpass-*.zip
          else
            ls -la dist/sentinelpass-*.tar.gz
          fi

      - name: Verify installer archive exists
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" == "windows" ]; then
            ls -la dist/sentinelpass-installer-*.zip
          else
            ls -la dist/sentinelpass-installer-*.tar.gz
          fi

  # Native installer smoke tests (only for real releases)
  native-installer-smoke:
    name: Native Installer Smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    # setup listed explicitly (it is also a transitive need via package) so
    # the is-release gate below reads from a declared dependency.
    needs: [setup, package]
    if: needs.setup.outputs.is-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: packages-${{ matrix.platform }}
          path: dist

      # Installed-artifact execution smoke: extract the PACKAGED portable
      # archive and prove the shipped binaries at least execute on each OS.
      # Extraction + direct execution ONLY — the interactive installers are
      # never run against runner system paths.
      #
      # `sentinelpass` is the only binary with a real --version (clap): the
      # daemon only ad-hoc-scans for --biometric/--start-locked and IGNORES
      # unknown args (so an unknown flag boots it, it never prints a
      # version), and the host/UI have no arg surface at all — for those we
      # assert presence + execute permission inside the archive instead of
      # exit codes. A functional
      # unlock/round-trip smoke on installed artifacts remains TD-REL-05.
      # Placed in this job rather than bundle-smoke because it is
      # release-gated (running binaries matters at tag time; PR preflight
      # keeps the cheap existence checks) and the artifacts are already
      # downloaded here.
      - name: Smoke packaged binaries
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          exe="${{ runner.os == 'Windows' && '.exe' || '' }}"
          if [ "${{ matrix.platform }}" == "windows" ]; then
            archive=$(find dist -maxdepth 1 -name 'sentinelpass-*.zip' ! -name '*installer*' | head -1 || true)
            unzip -q "$archive" -d "$work"
          else
            archive=$(find dist -maxdepth 1 -name 'sentinelpass-*.tar.gz' ! -name '*installer*' | head -1 || true)
            tar -xzf "$archive" -C "$work"
          fi
          echo "Extracted $(basename "$archive"):"
          ls -la "$work"

          version_out="$("$work/sentinelpass${exe}" --version)"
          echo "packaged CLI --version: ${version_out}"
          # Drift guard: package-job binaries are built BEFORE the version-
          # injection step runs, so they carry the COMMITTED workspace
          # version. This check therefore enforces tag == committed
          # manifest version (the crates-publish gate re-checks the same
          # agreement before publishing). A tag pushed before the release
          # commit's version bump fails here by design.
          echo "$version_out" | grep -q "${{ needs.setup.outputs.version }}" || {
            echo "::error::packaged CLI reports '${version_out}' but the tag version is ${{ needs.setup.outputs.version }}"
            exit 1
          }

          for bin_name in sentinelpass-daemon sentinelpass-host sentinelpass-ui; do
            f="$work/${bin_name}${exe}"
            if [ ! -f "$f" ]; then
              echo "::error::${bin_name}${exe} missing from portable archive"
              exit 1
            fi
            if [ ! -x "$f" ]; then
              echo "::error::${bin_name}${exe} is not executable"
              exit 1
            fi
          done
          echo "All packaged binaries present and executable; CLI runs."

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: installer-${{ matrix.platform }}
          web-build: true

      - name: Install Tauri CLI
        shell: bash
        run: |
          cargo install tauri-cli --version "^2.0.0" --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # WBS-905 sidecar staging: `cargo tauri build` alone bundles NO
      # daemon/host sidecars — tauri.conf.json declares
      # `resources: ["src-tauri/resources/bin/*"]` and the bundler SILENTLY
      # tolerates the empty glob, which is exactly how sidecar-less
      # installers shipped before. The staging script builds daemon + host,
      # copies them (with the Windows .exe suffix handled under Git Bash)
      # into src-tauri/resources/bin/, and FAILS if the staging directory is
      # still empty. --stage-only defers the slow bundling to the next step
      # so the tauri invocation (and its updater-signing env) stays visible.
      - name: Stage daemon/host sidecars into Tauri resources
        shell: bash
        run: bash scripts/build-native-installers.sh --stage-only

      # Fail-closed backstop, independent of the script: the two sidecar
      # files THEMSELVES (not any file — README.txt is git-tracked in this
      # directory, so a total-file count can never reach 0) must exist
      # non-empty, or the bundler would ship sidecar-less installers
      # silently (the exact WBS-905 regression).
      - name: Assert staged sidecars exist (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          staging="sentinelpass-ui/src-tauri/resources/bin"
          for sidecar in sentinelpass-daemon sentinelpass-host; do
            if ! find "$staging" -maxdepth 1 -type f -name "${sidecar}*" -size +0 | grep -q .; then
              echo "::error::no non-empty ${sidecar} staged in $staging — tauri would bundle installers without the daemon/host sidecars (WBS-905)"
              exit 1
            fi
          done
          echo "Staged sidecars verified in $staging:"
          ls -la "$staging"

      - name: Build Tauri bundles
        shell: bash
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          cd sentinelpass-ui
          cargo tauri build --verbose

      # WBS-905: prove the sidecars actually landed in the built bundles —
      # cheaply, per OS. Linux reads the .deb payload directly (dpkg-deb);
      # macOS walks the assembled .app; Windows installers (msi/nsis) have no
      # cheap offline introspection, so there the pre-build staging gate
      # above is the authoritative check and this step lists the bundle
      # outputs for the release record.
      - name: Verify sidecars landed in bundles
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.platform }}" == "linux" ]; then
            # `|| true` is REQUIRED under set -o pipefail: find exits 1 when any named
            # path is missing (tauri's bundle output location varies by invocation),
            # which killed this step with zero output on the v0.11.0 tag run.
            deb=$(find sentinelpass-ui/target/release/bundle/deb target/release/bundle/deb -name '*.deb' 2>/dev/null | head -1 || true)
            if [ -z "$deb" ]; then
              echo "::error::no .deb bundle found to verify sidecars against"
              exit 1
            fi
            echo "Inspecting $deb payload for staged sidecars:"
            listing=$(dpkg-deb -c "$deb")
            echo "$listing" | grep 'resources/bin/sentinelpass-daemon' || {
              echo "::error::.deb payload lacks resources/bin/sentinelpass-daemon (WBS-905)"; exit 1; }
            echo "$listing" | grep 'resources/bin/sentinelpass-host' || {
              echo "::error::.deb payload lacks resources/bin/sentinelpass-host (WBS-905)"; exit 1; }
          elif [ "${{ matrix.platform }}" == "macos" ]; then
            app=$(find sentinelpass-ui/target/release/bundle/macos target/release/bundle/macos -maxdepth 2 -name '*.app' 2>/dev/null | head -1 || true)
            if [ -z "$app" ]; then
              echo "::error::no .app bundle found to verify sidecars against"
              exit 1
            fi
            echo "Inspecting $app payload for staged sidecars:"
            find "$app" -type f | grep -E 'sentinelpass-(daemon|host)' || {
              echo "::error::.app bundle lacks daemon/host sidecars (WBS-905)"; exit 1; }
          else
            echo "Tauri bundle outputs (Windows — sidecar presence enforced by the pre-build staging gate):"
            find sentinelpass-ui/target/release/bundle target/release/bundle -type f 2>/dev/null | head -40 || true
          fi

      - name: Upload Tauri bundle artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tauri-bundles-${{ matrix.platform }}
          path: |
            sentinelpass-ui/target/release/bundle/deb/*.deb
            sentinelpass-ui/target/release/bundle/appimage/*.AppImage
            sentinelpass-ui/target/release/bundle/dmg/*.dmg
            sentinelpass-ui/target/release/bundle/macos/*.app
            sentinelpass-ui/target/release/bundle/msi/*.msi
            sentinelpass-ui/target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
          retention-days: 7

  # ---- TD-REL-01 / WBS-902: feature/platform matrix as a release
  # prerequisite --------------------------------------------------------------
  # The shipped desktop binaries are only ever built ONE way (default
  # features), so a feature-flag regression — e.g. the feature-gated `sync`
  # client/engine breaking, or the workspace no longer compiling without
  # defaults — would sit undetected until someone actually flips a flag.
  # This matrix builds the whole workspace three ways per release platform
  # and the `release` job now REQUIRES it: a red matrix leg aborts the
  # release before anything publishes (same fail-closed pattern as the
  # WBS-901 audits above).
  #
  # - Gated on is-release (skips PR preflight runs), so the
  #   ci-gate.yml expectation table is unaffected — like the WBS-901 audit
  #   jobs, these register no PR check runs.
  # - Feature names verified against the workspace manifests:
  #   sentinelpass-core defines `default = []` + `sync = ["reqwest"]` and is
  #   the only member with a `sync` feature, so bare `--features sync`
  #   resolves unambiguously for `--workspace` builds (virtual workspace).
  # - Mobile is deliberately NOT in this matrix: android.yml / ios.yml are
  #   the mobile gates (all-ABI JNI builds + the WBS-811 exported-symbol
  #   check on Android, iOS device/simulator builds + bridge-contract tests
  #   on iOS). They are PR-path-filtered and do NOT run at tag time, so the
  #   release manager must dispatch them manually against the tag ref — both
  #   accept `workflow_dispatch` (release-checklist item in
  #   docs/OSS_RELEASE_CHECKLIST.md).
  feature-matrix:
    name: Feature Matrix (${{ matrix.os }}, ${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: setup
    if: needs.setup.outputs.is-release == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        features: ["", "--no-default-features", "--features sync"]
        # Labels for the checks UI + distinct cache prefixes per leg.
        include:
          - features: ""
            label: default
          - features: "--no-default-features"
            label: no-default
          - features: "--features sync"
            label: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: feature-matrix-${{ matrix.os }}-${{ matrix.label }}

      - name: Build workspace (${{ matrix.label }})
        shell: bash
        run: cargo build --release --locked --workspace ${{ matrix.features }}

  # Create GitHub release and upload assets
  # Crates.io publish for the reusable protocol contract crate: sandhi's
  # sandhi-store pins sentinelpass-protocol, so an unpublished protocol crate
  # breaks a DIFFERENT repository's release. Review-hardened:
  # - runs only on real v* TAG pushes (a branch named v* must not reach the
  #   registry via workflow_dispatch);
  # - the gate checks the MANIFEST version at the tag, not the tag name — this
  #   repo's history has 13 of 17 tags where the two disagreed, and the tag
  #   name is exactly what an earlier draft wrongly trusted (re-review
  #   finding 1); a mismatch fails the job loudly instead of publishing a
  #   wrong version irreversibly;
  # - the publish step requires the gate to SUCCEED (not merely be skipped):
  #   a network-broken gate must not be followed by a publish attempt.
  # A yanked version still answers 200, so a yank is permanent — standard
  # crates.io semantics, noted rather than worked around.
  crates-publish:
    name: Publish sentinelpass-protocol to crates.io
    # WBS-901: publishing is irreversible (a yank is permanent) — it waits
    # for the tag-time security audits the same way the GitHub release does.
    needs: [setup, security-audit, npm-audit-root, npm-audit-e2e]
    if: >-
      ${{ needs.setup.outputs.is-release == 'true' &&
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag/manifest agreement and crates.io presence
        id: gate
        env:
          TAG_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          manifest_version=$(awk -F'"' '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version/{print $2;exit}' Cargo.toml)
          if [ "$TAG_VERSION" != "$manifest_version" ]; then
            echo "::error::tag is v${TAG_VERSION} but the workspace manifest says ${manifest_version} — bump the manifest inside the release commit (this repo's history: 13 of 17 tags were out of sync)"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "sentinelpass-release" \
            "https://crates.io/api/v1/crates/sentinelpass-protocol/${manifest_version}" || echo 000)
          if [ "$status" = "200" ]; then
            echo "sentinelpass-protocol ${manifest_version} already published — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "not yet published — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io returned ${status} — refusing to publish on an unclear answer"
            exit 1
          fi
      - name: Publish sentinelpass-protocol
        if: ${{ success() && steps.gate.outputs.skip == 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p sentinelpass-protocol --locked

  # Create GitHub release and upload assets. WBS-901: the release REQUIRES
  # the tag-time security gates — a failed audit aborts the release here,
  # before anything is published. TD-REL-01/WBS-902: it also REQUIRES the
  # feature/platform matrix for the same reason — a red matrix leg (default
  # features, --no-default-features, or the feature-gated `sync` build on any
  # release platform) aborts the release before anything publishes.
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs:
      - setup
      - bundle-smoke
      - native-installer-smoke
      - feature-matrix
      - security-audit
      - npm-audit-root
      - npm-audit-e2e
    if: needs.setup.outputs.is-release == 'true'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: packages-*
          path: release-assets
          merge-multiple: true

      - name: Download Tauri bundle artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tauri-bundles-*
          path: tauri-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f -exec sha256sum {} + > sha256sums.txt
          cat sha256sums.txt

      - name: Copy Tauri bundles to release assets
        shell: bash
        run: |
          VERSION="${{ needs.setup.outputs.version }}"

          # Function to find and copy bundles from potential locations
          find_and_copy_bundles() {
            local pattern="$1"
            local dest_name="$2"

            # Check tauri-assets directory
            if [ -d "tauri-assets" ]; then
              find tauri-assets -name "$pattern" -type f -print0 | xargs -0 -I {} cp {} "release-assets/$dest_name" 2>/dev/null && return 0
            fi

            # Check if tauri-assets has subdirectories
            if [ -d "tauri-assets/bundle" ]; then
              find tauri-assets/bundle -name "$pattern" -type f -print0 | xargs -0 -I {} cp {} "release-assets/$dest_name" 2>/dev/null && return 0
            fi

            # Check tauri-assets/deb, tauri-assets/appimage, etc.
            for dir in deb appimage dmg app msi nsis update; do
              if [ -d "tauri-assets/$dir" ]; then
                find "tauri-assets/$dir" -name "$pattern" -type f -print0 | xargs -0 -I {} cp {} "release-assets/" 2>/dev/null
              fi
            done

            return 0
          }

          echo "Searching for Tauri bundles..."

          # Copy macOS DMG
          find_and_copy_bundles "*.dmg" ""
          # Try to rename to expected filename
          if ls release-assets/*.dmg 1> /dev/null 2>&1; then
            FIRST_DMG=$(ls release-assets/*.dmg | head -1)
            if [ ! -f "release-assets/sentinelpass-${VERSION}-macos.dmg" ]; then
              cp "$FIRST_DMG" "release-assets/sentinelpass-${VERSION}-macos.dmg"
            fi
          fi

          # Copy Windows MSI
          find_and_copy_bundles "*.msi" ""
          # Try to rename to expected filename
          if ls release-assets/*.msi 1> /dev/null 2>&1; then
            FIRST_MSI=$(ls release-assets/*.msi | head -1)
            if [ ! -f "release-assets/sentinelpass-${VERSION}-windows.msi" ]; then
              cp "$FIRST_MSI" "release-assets/sentinelpass-${VERSION}-windows.msi"
            fi
          fi

          # Also copy other bundle types
          find_and_copy_bundles "*.deb" ""
          find_and_copy_bundles "*.AppImage" ""
          find_and_copy_bundles "*.app" ""
          find_and_copy_bundles "*.exe" ""

          echo "Tauri bundles copied:"
          ls -la release-assets/ | grep -E '\.(dmg|msi|deb|AppImage|exe)$' || echo "No bundle files found"

      - name: Regenerate SHA256 checksums with Tauri bundles
        shell: bash
        run: |
          cd release-assets
          find . -type f -exec sha256sum {} + > sha256sums.txt
          cat sha256sums.txt

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Release v${VERSION}

          ## Installation

          ### macOS DMG (Recommended)
          \`\`\`bash
          # Download DMG installer
          curl -LO https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-${VERSION}-macos.dmg
          # Open DMG and drag to Applications
          open sentinelpass-${VERSION}-macos.dmg
          \`\`\`

          ### Windows MSI (Recommended)
          \`\`\`powershell
          # Download MSI installer
          Invoke-WebRequest -Uri https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-${VERSION}-windows.msi -OutFile installer.msi
          # Run installer
          msiexec /i installer.msi
          \`\`\`

          ### Linux (Tarball)
          \`\`\`bash
          # Download tarball installer
          wget https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-installer-${VERSION}-linux.tar.gz
          tar -xzf sentinelpass-installer-${VERSION}-linux.tar.gz
          cd installer-root
          ./install.sh
          \`\`\`

          ### macOS (Homebrew)
          \`\`\`bash
          brew tap anvai-labs/tap https://github.com/anvai-labs/homebrew-tap
          brew install anvai-labs/tap/sentinelpass
          \`\`\`

          ### Ubuntu/Debian (.deb, Tauri desktop app)
          \`\`\`bash
          wget https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass_${VERSION}_amd64.deb
          sudo apt install ./sentinelpass_${VERSION}_amd64.deb
          \`\`\`

          ## Browser Extensions

          ### Chrome
          Download [sentinelpass-chrome-${VERSION}.zip](https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-chrome-${VERSION}.zip), unzip, and load as unpacked extension.

          ### Firefox
          Download [sentinelpass-firefox-${VERSION}.zip](https://github.com/anvai-labs/sentinelpass/releases/download/v${VERSION}/sentinelpass-firefox-${VERSION}.zip) and install temporarily.

          ## Verify Download

          \`\`\`bash
          sha256sum -c sha256sums.txt
          \`\`\`"
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          cd release-assets
          gh release upload "v${VERSION}" --clobber $(find . -type f)

  # The Homebrew formula bump lives in anvai-labs/homebrew-tap
  # (update-sentinelpass.yml there); this workflow no longer touches the tap.
  # The push-based job this replaces failed on every release: it committed to
  # main directly, which the tap's checks-only branch protection rejects.

  # ---- WBS-901: tag-time security gates -----------------------------------
  # security.yml is PR-triggered only, so a tag push previously reached the
  # `release` job with NO dependency scan at all. These three jobs re-run the
  # PR gate's audits at tag time and the `release` job now REQUIRES them —
  # a red audit blocks the release instead of being invisible.
  #
  # Design notes:
  # - Gated on `is-release` (tag pushes and dispatch-on-a-v*-tag) so PR
  #   preflight runs do NOT double-run the same audits security.yml already
  #   runs on the PR (the `release` job skips on those runs anyway, so the
  #   skip state of its needs is consistent).
  # - Trivy is deliberately NOT repeated here: its DB download is the
  #   expensive job, and its vuln findings for shipped languages are already
  #   covered by cargo audit + npm audit below.
  # - Audit POLICY is the governed .cargo/audit.toml (WBS-909) — no inline
  #   ignores. A HIGH/CRITICAL advisory with no governed exception fails the
  #   tag and blocks the release (register: docs/DEPENDENCY_EXCEPTIONS.md).
  # - These jobs produce no PR check runs, so ci-gate.yml's expectation
  #   table is unaffected (the Gate is PR-only; tag runs have no Gate).
  security-audit:
    name: Release Security Audit (RustSec)
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c # cargo-audit
      - name: Run cargo audit (governed policy)
        run: cargo audit

  npm-audit-root:
    name: Release Security Audit (npm root)
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Run npm audit (high+)
        # Same registry-flake retry as security.yml.
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm audit attempt ${attempt} failed (registry flake?) - retrying in 60s"
              sleep 60
            fi
          done
          exit 1

  npm-audit-e2e:
    name: Release Security Audit (npm extension e2e)
    runs-on: ubuntu-24.04
    needs: setup
    if: needs.setup.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-extension/e2e/package-lock.json
      - name: Install e2e dependencies
        working-directory: browser-extension/e2e
        run: npm ci
      - name: Run npm audit (high+)
        working-directory: browser-extension/e2e
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::npm audit attempt ${attempt} failed (registry flake?) - retrying in 60s"
              sleep 60
            fi
          done
          exit 1
