name: Android CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'sentinelpass-core/**'
      - 'sentinelpass-mobile-bridge/**'
      - 'android/**'
      - '.github/workflows/android.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build JNI libraries for all Android architectures
  mobile-bridge:
    name: Build JNI Libraries (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-jni-libs

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          NDK_ROOT=$(pwd)/android-ndk-r25c
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_TOOLCHAIN_DIR=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          # Diagnostic: Check available clang versions
          echo "=== Available clang versions ==="
          ls "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep "android.*-clang" | head -30
          echo "=== Checking armv7 variants ==="
          ls "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -i "armv7\|arm.*androideabi" | head -20
          echo "================================"

      - name: Build JNI libraries (all ABIs, --features jni)
        run: |
          # WBS-811: EVERY Android ABI is built WITH the JNI feature (the
          # pre-811 job built without it, producing .so files with zero
          # Java_* symbols — TD-MOB-01). ABI coverage matches the app's
          # abiFilters: arm64-v8a, armeabi-v7a, x86_64.
          # API level 33 wrappers are available in NDK r25c.
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android33-clang"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi33-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android33-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"

          # CC/CFLAGS for libsqlite3-sys and other build scripts
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android33-clang"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi33-clang"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android33-clang"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android33"
          export CFLAGS_armv7_linux_androideabi="--target=armv7a-linux-androideabi33"
          export CFLAGS_x86_64_linux_android="--target=x86_64-linux-android33"

          for target in aarch64-linux-android armv7-linux-androideabi x86_64-linux-android; do
            cargo build --package sentinelpass-mobile-bridge --target $target --release --features jni
          done

      - name: Verify Java_* symbols in every built .so (WBS-811)
        run: |
          # The JNI contract (WBS-802): each Kotlin external fun in
          # com.sentinelpass.VaultBridge must resolve to an exported symbol in
          # EVERY ABI's .so, and no stale VaultManager/DriveSync symbols may
          # remain. Fail-closed: a missing or stale symbol fails the job
          # before the artifact can reach the app build.
          set -euo pipefail
          EXPECTED="nativeAbiVersion nativeInit nativeDestroy nativeIsUnlocked nativeLock nativeAddEntry nativeGetEntry nativeListEntries nativeSearchEntries nativeDeleteEntry nativeUpdateEntry nativeGenerateTotp nativeGeneratePassword nativeCheckStrength nativeBiometricHasKey nativeBiometricRemoveKey nativeBiometricUnlock"
          STALE_RE="Java_com_sentinelpass_(VaultManager|DriveSync)_"
          for so in \
            target/aarch64-linux-android/release/libsentinelpass_mobile_bridge.so \
            target/armv7-linux-androideabi/release/libsentinelpass_mobile_bridge.so \
            target/x86_64-linux-android/release/libsentinelpass_mobile_bridge.so; do
            echo "=== $so ==="
            for m in $EXPECTED; do
              if ! llvm-nm -D --defined-only "$so" | grep -q "Java_com_sentinelpass_VaultBridge_${m}$"; then
                echo "::error::$so is missing JNI symbol Java_com_sentinelpass_VaultBridge_${m}"
                exit 1
              fi
            done
            if llvm-nm -D --defined-only "$so" | grep -Eq "$STALE_RE"; then
              echo "::error::$so exports stale (pre-WBS-802) VaultManager/DriveSync symbols"
              llvm-nm -D --defined-only "$so" | grep -E "$STALE_RE"
              exit 1
            fi
            echo "all 17 VaultBridge JNI symbols present, no stale symbols"
          done

      - name: Organize JNI libraries for Android
        run: |
          # Create jniLibs directory structure for Android
          mkdir -p jniLibs/arm64-v8a
          mkdir -p jniLibs/armeabi-v7a
          mkdir -p jniLibs/x86_64

          # Copy libraries to Android-specific ABI directories
          cp target/aarch64-linux-android/release/libsentinelpass_mobile_bridge.so jniLibs/arm64-v8a/
          cp target/armv7-linux-androideabi/release/libsentinelpass_mobile_bridge.so jniLibs/armeabi-v7a/
          cp target/x86_64-linux-android/release/libsentinelpass_mobile_bridge.so jniLibs/x86_64/

          # Verify the structure
          echo "JNI library structure:"
          find jniLibs -name "*.so" -exec ls -lh {} \;

      - name: Upload JNI libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-jni-libs
          path: jniLibs/
          retention-days: 7

  # Android Unit Tests
  unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    needs: mobile-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-unit-tests

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: android/SentinelPass
        run: |
          ./gradlew testDebugUnitTest \
            --continue \
            --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-unit-test-results
          path: android/SentinelPass/app/build/reports/tests/
          retention-days: 7

  # Android Emulator Tests
  emulator-tests:
    name: Android Emulator Tests
    # ubuntu-latest is x86_64 and supports KVM hardware acceleration for Android
    # emulators. macos-latest is now arm64 and cannot run x86_64 AVD images.
    runs-on: ubuntu-latest
    needs: mobile-bridge

    strategy:
      matrix:
        api-level: [29, 34]
        target: [default, google_apis]
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-emulator-${{ matrix.api-level }}

      - name: Download JNI libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-jni-libs
          path: android/SentinelPass/app/src/main/jniLibs/

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts', '**/libs/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd android/SentinelPass && ./gradlew connectedDebugAndroidTest --continue --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-emulator-test-results-api-${{ matrix.api-level }}
          path: android/SentinelPass/app/build/reports/androidTests/
          retention-days: 7

  # Android Lint
  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Run Android Lint
        working-directory: android/SentinelPass
        run: |
          ./gradlew lintDebug \
            --stacktrace

      - name: Upload lint results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-lint-results
          path: android/SentinelPass/app/build/reports/lint-results-*.html
          retention-days: 7

  # Integration Tests
  integration-tests:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    needs: mobile-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-integration

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          NDK_ROOT=$(pwd)/android-ndk-r25c
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> $GITHUB_ENV
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          echo "NDK_TOOLCHAIN_DIR=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_ENV
          # Diagnostic: Check available clang versions
          echo "=== Available clang versions ==="
          ls "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep "android.*-clang" | head -30
          echo "=== Checking armv7 variants ==="
          ls "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -i "armv7\|arm.*androideabi" | head -20
          echo "================================"

      - name: Verify generated C header is in sync (WBS-801)
        run: |
          # The checked-in header is build-generated by cbindgen (build.rs).
          # Regenerate it on the host target and fail if the committed copy
          # drifted from the declared ABI contract (cbindgen.toml + src/ffi.rs).
          cargo build --package sentinelpass-mobile-bridge --lib
          git diff --exit-code -- sentinelpass-mobile-bridge/include/ \
            || { echo "::error::include/sentinelpass_bridge.h is stale — rebuild the bridge and commit the regenerated header"; exit 1; }
          echo "Header in sync with cbindgen.toml + src/ffi.rs"

      - name: Verify bridge header compiles
        run: |
          # Verify the bridge header (common C ABI) compiles cleanly. Since
          # WBS-807 removed the un-gated drive/icloud modules, the header
          # contains no JNI declarations at all — it is pure C ABI.
          echo '#include "sentinelpass-mobile-bridge/include/sentinelpass_bridge.h"' \
            | clang -x c -fsyntax-only - && echo "Header compiles OK"

      - name: Run bridge ABI contract tests
        run: |
          # Pins the generated header and cbindgen.toml to the real FFI export
          # surface (WBS-801).
          cargo test --package sentinelpass-mobile-bridge --lib

      - name: Verify the JNI feature compiles and tests clean (WBS-810)
        run: |
          # TD-MOB-01 first half: JNI-enabled Rust MUST build. The jni crate
          # compiles on any host, so the whole VaultBridge JNI surface is
          # compiled, clippy-clean, and unit-tested here on the host —
          # complementing the all-ABI symbol check in the mobile-bridge job.
          cargo clippy --package sentinelpass-mobile-bridge --lib --tests --features jni -- -D warnings
          cargo test --package sentinelpass-mobile-bridge --features jni

  # Build APK
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-apk

      - name: Download JNI libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-jni-libs
          path: android/SentinelPass/app/src/main/jniLibs/

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-apk-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}

      - name: Build debug APK
        working-directory: android/SentinelPass
        run: |
          ./gradlew assembleDebug \
            --stacktrace

      - name: Build release APK
        working-directory: android/SentinelPass
        run: |
          ./gradlew assembleRelease \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-debug
          path: android/SentinelPass/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk-release
          path: android/SentinelPass/app/build/outputs/apk/release/*.apk
          retention-days: 7
