name: Android CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'sentinelpass-core/**'
      - 'sentinelpass-mobile-bridge/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'sentinelpass-core/**'
      - 'sentinelpass-mobile-bridge/**'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build JNI libraries for all Android architectures
  mobile-bridge:
    name: Build JNI Libraries (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: |
            aarch64-linux-android
            x86_64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-jni-libs

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          NDK_ROOT=$(pwd)/android-ndk-r25c
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NDK_TOOLCHAIN_DIR=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          # Diagnostic: Check available clang versions
          echo "=== Available clang versions ==="
          find "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f -name '*android*-clang' -print | head -30
          echo "=== Checking armv7 variants ==="
          find "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f -print | grep -Ei '/(armv7|arm.*androideabi)' | head -20
          echo "================================"

      - name: Build JNI libraries
        run: |
          # Set linker and ar environment variables using shell expansion
          # Use API level 33 which is available in NDK r25c
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export AR_x86_64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

          # Set CC environment variables for libsqlite3-sys and other build scripts
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          export CC_x86_64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang"
          export CFLAGS_aarch64_linux_android="--target=aarch64-linux-android33"
          export CFLAGS_x86_64_linux_android="--target=x86_64-linux-android33"

          # Build for each architecture (64-bit only - 32-bit ARM is deprecated)
          for target in aarch64-linux-android x86_64-linux-android; do
            cargo build --package sentinelpass-mobile-bridge --target $target --release
          done

      - name: Organize JNI libraries for Android
        run: |
          # Create jniLibs directory structure for Android
          mkdir -p jniLibs/arm64-v8a
          mkdir -p jniLibs/x86_64

          # Copy libraries to Android-specific ABI directories
          # aarch64-linux-android -> arm64-v8a
          cp target/aarch64-linux-android/release/libsentinelpass_mobile_bridge.so jniLibs/arm64-v8a/

          # x86_64-linux-android -> x86_64
          cp target/x86_64-linux-android/release/libsentinelpass_mobile_bridge.so jniLibs/x86_64/

          # Verify the structure
          echo "JNI library structure:"
          find jniLibs -name "*.so" -exec ls -lh {} \;

      - name: Upload JNI libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-jni-libs
          path: jniLibs/
          retention-days: 7

  # Android Unit Tests
  unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    needs: mobile-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-unit-tests

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: android/SentinelPass
        run: |
          ./gradlew testDebugUnitTest \
            --continue \
            --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-unit-test-results
          path: android/SentinelPass/app/build/reports/tests/
          retention-days: 7

  # Android Emulator Tests
  emulator-tests:
    name: Android Emulator Tests
    # ubuntu-latest is x86_64 and supports KVM hardware acceleration for Android
    # emulators. macos-latest is now arm64 and cannot run x86_64 AVD images.
    runs-on: ubuntu-latest
    needs: mobile-bridge

    strategy:
      matrix:
        api-level: [29, 34]
        target: [default, google_apis]
        arch: [x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-emulator-${{ matrix.api-level }}

      - name: Download JNI libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-jni-libs
          path: android/SentinelPass/app/src/main/jniLibs/

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts', '**/libs/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd android/SentinelPass && ./gradlew connectedDebugAndroidTest \
              --continue \
              --stacktrace

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-emulator-test-results-api-${{ matrix.api-level }}
          path: android/SentinelPass/app/build/reports/androidTests/
          retention-days: 7

  # Android Lint
  lint:
    name: Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Run Android Lint
        working-directory: android/SentinelPass
        run: |
          ./gradlew lintDebug \
            --stacktrace

      - name: Upload lint results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint-results
          path: android/SentinelPass/app/build/reports/lint-results-*.html
          retention-days: 7

  # Integration Tests
  integration-tests:
    name: Android Integration Tests
    runs-on: ubuntu-latest
    needs: mobile-bridge

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-integration

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          NDK_ROOT=$(pwd)/android-ndk-r25c
          echo "ANDROID_NDK_HOME=$NDK_ROOT" >> "$GITHUB_ENV"
          echo "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NDK_TOOLCHAIN_DIR=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          # Diagnostic: Check available clang versions
          echo "=== Available clang versions ==="
          find "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f -name '*android*-clang' -print | head -30
          echo "=== Checking armv7 variants ==="
          find "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" -maxdepth 1 -type f -print | grep -Ei '/(armv7|arm.*androideabi)' | head -20
          echo "================================"

      - name: Run integration tests
        run: |
          # Skip integration tests for cross-compiled Android targets
          # Android integration tests run in the emulator instead
          echo "Skipping cross-compiled integration tests - covered by emulator tests"

      - name: Test JNI bridge API
        run: |
          # Skip JNI bridge API tests for cross-compiled targets
          # JNI bridge tests run in the Android emulator instead
          echo "Skipping JNI bridge API tests - covered by emulator tests"

  # Build APK
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          prefix-key: android-apk

      - name: Download JNI libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-jni-libs
          path: android/SentinelPass/app/src/main/jniLibs/

      - name: Grant execute permission for gradlew
        working-directory: android/SentinelPass
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-apk-${{ hashFiles('**/*.gradle*', '**/*.gradle.kts') }}

      - name: Build debug APK
        working-directory: android/SentinelPass
        run: |
          ./gradlew assembleDebug \
            --stacktrace

      - name: Build release APK
        working-directory: android/SentinelPass
        run: |
          ./gradlew assembleRelease \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk-debug
          path: android/SentinelPass/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apk-release
          path: android/SentinelPass/app/build/outputs/apk/release/*.apk
          retention-days: 7
