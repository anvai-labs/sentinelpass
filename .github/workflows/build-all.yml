name: Build All Platforms

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - desktop
          - mobile
          - web
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - debug
          - release

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Desktop Builds (Linux, macOS, Windows)
  # ============================================================================
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: build-all-${{ matrix.platform }}

      - name: Build desktop platforms
        run: |
          ./scripts/build-desktop.sh \
            --${{ github.event.inputs.build_type || 'release' }} \
            --platform current

      - name: Run desktop tests
        run: |
          ./scripts/test-rust.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            target/release/sentinelpass*
            target/debug/sentinelpass*
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # Mobile Builds (iOS, Android)
  # ============================================================================
  mobile-ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-all-ios

      - name: Build iOS platform
        run: |
          ./scripts/build-ios.sh \
            --${{ github.event.inputs.build_type || 'release' }}

      - name: Run iOS tests
        run: |
          cargo test --package sentinelpass-mobile-bridge \
            --target aarch64-apple-ios-sim

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-libraries
          path: |
            target/aarch64-apple-ios/release/*.a
            target/aarch64-apple-ios-sim/release/*.a
            ios/SentinelPass/SentinelPass/Native/libs/*.a
          retention-days: 7
          if-no-files-found: warn

  mobile-android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: build-all-android

      - name: Setup Android JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android platform
        run: |
          ./scripts/build-android.sh \
            --${{ github.event.inputs.build_type || 'release' }}

      - name: Run Android tests
        run: |
          cargo test --package sentinelpass-mobile-bridge

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/android/*.apk
            build/android/*.aab
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # Web Builds (Browser Extensions)
  # ============================================================================
  web:
    name: Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build environment
        uses: ./.github/actions/setup-rust-env
        with:
          cache-key-prefix: build-all-web
          linux-deps: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: |
          ./scripts/build-web.sh || npm run web:build

      - name: Run web tests
        run: |
          npm run test:ts

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: |
            sentinelpass-ui/dist
            browser-extension/chrome/dist
            browser-extension/firefox/dist
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # Security & Linting
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run security audit
        run: |
          ./scripts/security-audit.sh

      - name: Run clippy
        run: |
          ./scripts/lint-rust.sh

      - name: Check formatting
        run: |
          cargo fmt --all -- --check

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [desktop, mobile-ios, mobile-android, web, security]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Desktop: ${{ needs.desktop.result }}"
          echo "iOS: ${{ needs.mobile-ios.result }}"
          echo "Android: ${{ needs.mobile-android.result }}"
          echo "Web: ${{ needs.web.result }}"
          echo "Security: ${{ needs.security.result }}"

          if [ "${{ needs.desktop.result }}" != "success" ] || \
             [ "${{ needs.mobile-ios.result }}" != "success" ] || \
             [ "${{ needs.mobile-android.result }}" != "success" ] || \
             [ "${{ needs.web.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ]; then
            echo "One or more builds failed"
            exit 1
          fi

          echo "All builds completed successfully!"
