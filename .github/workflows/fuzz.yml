name: Fuzz (scheduled)

# WBS-903: bounded coverage-guided fuzzing of the hostile-input parsers
# (see fuzz/README.md). Deliberately NOT a PR/required check — it needs a
# nightly toolchain and libFuzzer, and required CI must stay stable.
# Findings are uploaded as artifacts for triage; a reproducer must be
# minimized and pinned as a regression test in the owning crate.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 03:17 UTC (off the hour to avoid the runner rush).
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: cargo fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_envelope_open
          - fuzz_sync_mutation
          - fuzz_ipc_frame
          - fuzz_import_parse
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable (pinned action; toolchain selected below)
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Run ${{ matrix.target }} (bounded)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=120
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
