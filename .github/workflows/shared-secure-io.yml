name: Shared secure I/O
on:
  pull_request:
    paths:
      - 'anvai-secure-io/**'
      - 'Cargo.lock'
      - '.github/workflows/shared-secure-io.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 test -p anvai-secure-io --locked
