name: Chrome Extension Release

# SECURITY: this workflow publishes extension artifacts to users, so its
# trigger set is deliberately restricted to events a fork pull request
# cannot cause (push of a reviewed `chrome-v*` tag, maintainer
# workflow_dispatch). Never add `pull_request`/`pull_request_target` here.
# This repo's branches require 1 approving review, which is the
# precondition this design depends on (see the SECURITY header in
# public-overflow-runner-smoke.yml for the shared threat model).

on:
  push:
    tags:
      - 'chrome-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version (e.g., 0.1.0)'
        required: true
        type: string
      publish_target:
        description: 'Publish target'
        required: true
        type: choice
        default: 'test'
        options:
          - test
          - production

# contents: write is the minimum required to publish the GitHub release
# (zips + SHA256 checksums) on tag pushes; no other permission is granted.
permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and Publish Browser Extensions
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension artifacts (canonical pipeline)
        run: npm run ext:build

      - name: Extension pipeline drift gate
        # Refuse to release from a tree whose checked-in artifacts have
        # drifted from the canonical pipeline (WBS-717/WBS-719 gate).
        run: npx vitest run tests/web/extension-pipeline.test.ts

      - name: Determine extension version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#chrome-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update manifest versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for target in chrome firefox; do
            jq --arg version "$VERSION" '.version = $version' \
              "browser-extension/${target}/manifest.json" > manifest.json.tmp
            mv manifest.json.tmp "browser-extension/${target}/manifest.json"
            echo "Updated ${target} manifest version to ${VERSION}"
            jq '{version, name}' "browser-extension/${target}/manifest.json"
          done

      - name: Package extensions (build-output derived)
        # The packaging scripts rebuild via `npm run ext:build` (idempotent,
        # .js only — the manifest version bump above survives) and zip the
        # runtime file set derived from the build output, the same set
        # installation/install.sh deploys (WBS-911 F2/F10).
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash browser-extension/package-chrome.sh "$VERSION"
          bash browser-extension/package-firefox.sh "$VERSION"
          ls -lh browser-extension/dist/

      - name: Verify package contents
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for target in chrome firefox; do
            ZIP_FILE="browser-extension/dist/sentinelpass-${target}-${VERSION}.zip"
            echo "== ${ZIP_FILE} =="
            unzip -l "$ZIP_FILE"

            echo "Checking for TypeScript files..."
            if unzip -l "$ZIP_FILE" | grep -q "\.ts$"; then
              echo "ERROR: TypeScript files found in ${ZIP_FILE}!"
              exit 1
            fi

            echo "Checking every built .js artifact is present (WBS-911 F2)..."
            for f in "browser-extension/${target}"/*.js; do
              base="$(basename "$f")"
              if ! unzip -l "$ZIP_FILE" | grep -q "[[:space:]]${base}\$"; then
                echo "ERROR: built artifact ${base} missing from ${ZIP_FILE}!"
                exit 1
              fi
            done

            echo "Checking packaged manifest version..."
            unzip -p "$ZIP_FILE" manifest.json | jq -e --arg v "$VERSION" '.version == $v' > /dev/null \
              || { echo "ERROR: ${ZIP_FILE} manifest version != ${VERSION}"; exit 1; }
            echo "OK: ${ZIP_FILE}"
          done

      - name: Generate SHA256 checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd browser-extension/dist
          sha256sum \
            "sentinelpass-chrome-${VERSION}.zip" \
            "sentinelpass-firefox-${VERSION}.zip" > sha256sums.txt
          cat sha256sums.txt

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-extensions
          path: |
            browser-extension/dist/*.zip
            browser-extension/dist/sha256sums.txt
          retention-days: 30

      - name: Create GitHub Release (tag pushes)
        # Release publication is tied to a reviewed tag; manual dispatch
        # runs still produce the uploaded artifact and webstore uploads.
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd browser-extension/dist
          gh release create "${GITHUB_REF_NAME}" \
            --title "Browser Extensions ${VERSION}" \
            --notes "Browser extension release ${VERSION}.

          ## Chrome / Chromium

          Download \`sentinelpass-chrome-${VERSION}.zip\`, unzip, then load the
          folder via \`chrome://extensions\` -> \`Load unpacked\`.

          ## Firefox

          Download \`sentinelpass-firefox-${VERSION}.zip\` and install via
          \`about:debugging#/runtime/this-firefox\` -> \`Load Temporary Add-on\`,
          or submit through AMO.

          ## Verify downloads

          \`\`\`bash
          sha256sum -c sha256sums.txt
          \`\`\`"
          gh release upload "${GITHUB_REF_NAME}" --clobber \
            "sentinelpass-chrome-${VERSION}.zip" \
            "sentinelpass-firefox-${VERSION}.zip" \
            sha256sums.txt

      - name: Publish to Chrome Web Store (Test)
        if: github.event.inputs.publish_target != 'production'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          APP_ID: ${{ secrets.CHROME_WEBSTORE_APP_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_FILE="browser-extension/dist/sentinelpass-chrome-${VERSION}.zip"

          # Install webstore-upload CLI
          npm install -g chrome-webstore-upload

          # Upload to Chrome Web Store (trusted testers)
          echo "Uploading extension to Chrome Web Store (trusted testers)..."
          chrome-webstore-upload upload \
            --source "$ZIP_FILE" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --app-id "$APP_ID" \
            --trusted-users

          echo "Extension uploaded to Chrome Web Store for trusted testers"
          echo "Note: This is a TEST upload. The extension is NOT published to the public store."

      - name: Publish to Chrome Web Store (Production)
        if: github.event.inputs.publish_target == 'production'
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          APP_ID: ${{ secrets.CHROME_WEBSTORE_APP_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_FILE="browser-extension/dist/sentinelpass-chrome-${VERSION}.zip"

          # Install webstore-upload CLI
          npm install -g chrome-webstore-upload

          # Upload to Chrome Web Store
          echo "Uploading extension to Chrome Web Store..."
          chrome-webstore-upload upload \
            --source "$ZIP_FILE" \
            --extension-id "$EXTENSION_ID" \
            --client-id "$CLIENT_ID" \
            --client-secret "$CLIENT_SECRET" \
            --refresh-token "$REFRESH_TOKEN" \
            --app-id "$APP_ID" \
            --publish

          echo "Extension published to Chrome Web Store!"
